<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14121f">
  <title>Camisetas AR · Pixel Art</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <video id="camera" playsinline muted autoplay></video>
  <canvas id="stage" aria-label="Personaje en realidad aumentada"></canvas>

  <main id="intro" class="panel">
    <h1 id="title">Camisetas AR</h1>
    <p id="subtitle">Pixel art que cobra vida.</p>
    <div id="picker" class="picker" hidden></div>
    <button id="start" class="btn" type="button" hidden>Activar cámara y ver personaje</button>
    <p id="status" class="status" role="status"></p>
  </main>

  <div id="controls" class="controls" hidden>
    <button id="shot" class="btn small" type="button">📸 Foto</button>
    <button id="reset" class="btn small ghost" type="button">Centrar</button>
    <button id="stop" class="btn small ghost" type="button">Salir</button>
  </div>
  <p id="hint" class="hint" hidden>Arrastra para mover · pellizca para cambiar el tamaño</p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
